[project]
name = "langflow-mas"
version = "0.1.0"
description = "Sistema multi-agente (MAS) construido con Langflow"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "langflow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langflow_mas"]
